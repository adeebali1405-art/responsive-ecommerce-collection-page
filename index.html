<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopCollection — E-Commerce Collection Page</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --star: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header / Navbar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .search-box {
      flex: 1;
      max-width: 420px;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .cart-btn {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .cart-badge {
      background: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }

    /* Main Layout */
    .container {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    /* Sidebar Filters */
    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: sticky;
      top: 4.75rem;
    }

    .filters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .filters-header h2 {
      font-size: 1.05rem;
    }

    .clear-all-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-all-btn:hover {
      text-decoration: underline;
    }

    .filter-group {
      margin-bottom: 1.35rem;
    }

    .filter-group-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mini-clear {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .category-list,
    .rating-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .checkbox-label,
    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text);
    }

    .price-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .price-inputs input {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .price-range-display {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Mobile Filter Toggle */
    .mobile-filter-toggle {
      display: none;
      width: 100%;
      padding: 0.65rem;
      margin-bottom: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toolbar & Active Badges */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .product-count {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .sort-control select {
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }

    .filter-badge {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-badge button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .product-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f1f5f9;
      cursor: pointer;
    }

    .product-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.45rem;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary);
      font-weight: 600;
    }

    .product-title {
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .product-title:hover {
      color: var(--primary);
    }

    .product-rating {
      color: var(--star);
      font-size: 0.9rem;
    }

    .product-rating span {
      color: var(--muted);
      font-size: 0.82rem;
      margin-left: 0.25rem;
    }

    .product-footer {
      margin-top: auto;
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .product-price {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .add-cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 0.85rem;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .add-cart-btn:hover {
      background: var(--primary-hover);
    }

    /* Empty State & Pagination */
    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .empty-state h3 {
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .load-more-wrap {
      margin-top: 1.75rem;
      text-align: center;
    }

    .load-more-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .load-more-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Modal (Product Details) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 650px;
      width: 100%;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      position: relative;
    }

    .modal-card img {
      width: 100%;
      height: 100%;
      min-height: 240px;
      object-fit: cover;
    }

    .modal-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Responsive Breakpoints */
    @media (max-width: 992px) {
      .container {
        grid-template-columns: 230px 1fr;
      }
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      .mobile-filter-toggle {
        display: block;
      }
      .filters-panel {
        display: none;
        position: static;
        margin-bottom: 1rem;
      }
      .filters-panel.open {
        display: block;
      }
      .modal-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="#" class="brand" id="resetLogo">ShopCollection</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products by name..." aria-label="Search products by name" />
      </div>
      <button class="cart-btn" id="cartBtn">
        Cart <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <div class="container">
    <aside>
      <button class="mobile-filter-toggle" id="mobileFilterToggle">Filters & Categories</button>

      <div class="filters-panel" id="filtersPanel">
        <div class="filters-header">
          <h2>Filters</h2>
          <button class="clear-all-btn" id="clearAllBtn">Clear All Filters</button>
        </div>

        <!-- Category Filter -->
        <div class="filter-group">
          <div class="filter-group-title">
            <span>Categories</span>
            <button class="mini-clear" id="clearCategoryBtn">Clear</button>
          </div>
          <div class="category-list" id="categoryList"></div>
        </div>

        <!-- Price Filter -->
        <div class="filter-group">
          <div class="filter-group-title">
            <span>Price Range ($)</span>
          </div>
          <div class="price-inputs">
            <input type="number" id="minPriceInput" placeholder="Min" min="0" />
            <input type="number" id="maxPriceInput" placeholder="Max" min="0" />
          </div>
          <div class="price-range-display" id="priceRangeDisplay">Selected Price: Any</div>
        </div>

        <!-- Rating Filter -->
        <div class="filter-group">
          <div class="filter-group-title">
            <span>Minimum Rating</span>
          </div>
          <div class="rating-list" id="ratingList">
            <label class="radio-label"><input type="radio" name="rating" value="0" checked /> All Ratings</label>
            <label class="radio-label"><input type="radio" name="rating" value="4" /> 4 stars & above</label>
            <label class="radio-label"><input type="radio" name="rating" value="3" /> 3 stars & above</label>
            <label class="radio-label"><input type="radio" name="rating" value="2" /> 2 stars & above</label>
            <label class="radio-label"><input type="radio" name="rating" value="1" /> 1 star & above</label>
          </div>
        </div>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="product-count" id="productCount">Showing 0 products</div>
        <div class="sort-control">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect">
            <option value="default">Default Sorting</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating-asc">Rating: Low to High</option>
            <option value="rating-desc">Rating: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
          </select>
        </div>
      </div>

      <!-- Active Filter Badges -->
      <div class="active-filters" id="activeFilters"></div>

      <!-- Products Grid -->
      <section class="product-grid" id="productGrid"></section>

      <!-- Load More Button -->
      <div class="load-more-wrap" id="loadMoreWrap" style="display: none;">
        <button class="load-more-btn" id="loadMoreBtn">Load More Products</button>
      </div>
    </main>
  </div>

  <!-- Product Details Modal -->
  <div class="modal-backdrop" id="productModal">
    <div class="modal-card">
      <button class="modal-close" id="closeModalBtn" aria-label="Close modal">×</button>
      <img id="modalImg" src="" alt="" />
      <div class="modal-content">
        <div class="product-category" id="modalCategory"></div>
        <h2 id="modalTitle"></h2>
        <div class="product-rating" id="modalRating"></div>
        <div class="product-price" id="modalPrice"></div>
        <p id="modalDescription" style="color: var(--muted); font-size: 0.92rem;"></p>
        <button class="add-cart-btn" id="modalAddCartBtn" style="margin-top: auto; padding: 0.65rem 1rem;">
          Add to Cart
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. Product Data Array (Single Source of Truth)
    const products = [
      {
        id: 1,
        name: "Wireless Noise-Canceling Headphones",
        price: 149.99,
        category: "Electronics",
        rating: 4.8,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80",
        description: "Over-ear wireless headphones with active noise cancellation, 30-hour battery life, and plush memory foam cushions."
      },
      {
        id: 2,
        name: "Classic Cotton Crewneck Tee",
        price: 24.50,
        category: "Clothing",
        rating: 4.3,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80",
        description: "Breathable 100% organic cotton t-shirt tailored for everyday comfort and durability."
      },
      {
        id: 3,
        name: "Minimalist Ceramic Pour-Over Set",
        price: 42.00,
        category: "Home & Kitchen",
        rating: 4.6,
        image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?auto=format&fit=crop&w=600&q=80",
        description: "Hand-glazed ceramic coffee dripper and matching server designed for clean, flavorful extraction."
      },
      {
        id: 4,
        name: "Mechanical Tactile Keyboard",
        price: 89.00,
        category: "Electronics",
        rating: 4.7,
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80",
        description: "Compact 75% mechanical keyboard with hot-swappable tactile switches and white LED backlight."
      },
      {
        id: 5,
        name: "Everyday Running Sneakers",
        price: 78.00,
        category: "Footwear",
        rating: 4.4,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80",
        description: "Lightweight cushioned running shoes with breathable mesh upper and high-traction rubber outsole."
      },
      {
        id: 6,
        name: "Slim Leather Cardholder Wallet",
        price: 34.00,
        category: "Accessories",
        rating: 4.1,
        image: "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=600&q=80",
        description: "Full-grain leather wallet with four card slots and a central cash compartment."
      },
      {
        id: 7,
        name: "Smart Fitness Watch",
        price: 129.00,
        category: "Electronics",
        rating: 3.9,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80",
        description: "Track heart rate, sleep stages, steps, and workouts with a bright AMOLED display."
      },
      {
        id: 8,
        name: "Linen Relaxed Overshirt",
        price: 56.00,
        category: "Clothing",
        rating: 4.5,
        image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=600&q=80",
        description: "Airy linen-blend overshirt ideal for layering in warm weather or casual evenings."
      },
      {
        id: 9,
        name: "Insulated Stainless Tumbler",
        price: 29.99,
        category: "Home & Kitchen",
        rating: 4.9,
        image: "https://images.unsplash.com/photo-1570831739435-6601aa3fa4fb?auto=format&fit=crop&w=600&q=80",
        description: "Double-wall vacuum insulated 20oz tumbler that keeps drinks cold for 24 hours or hot for 12."
      },
      {
        id: 10,
        name: "Canvas Weekender Duffel",
        price: 68.50,
        category: "Accessories",
        rating: 3.4,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",
        description: "Durable waxed-canvas travel bag with detachable shoulder strap and reinforced handles."
      },
      {
        id: 11,
        name: "Suede Chelsea Boots",
        price: 115.00,
        category: "Footwear",
        rating: 4.2,
        image: "https://images.unsplash.com/photo-1608256246200-53e635b5b65f?auto=format&fit=crop&w=600&q=80",
        description: "Classic pull-on suede boots with elastic side panels and comfortable stacked heel."
      },
      {
        id: 12,
        name: "Desk LED Task Lamp",
        price: 47.50,
        category: "Home & Kitchen",
        rating: 2.8,
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80",
        description: "Adjustable aluminum desk lamp with three color temperatures and touch dimming."
      }
    ];

    // 2. Application State
    const state = {
      search: "",
      categories: [],
      minPrice: null,
      maxPrice: null,
      minRating: 0,
      sortBy: "default",
      visibleCount: 6,
      cartCount: 0
    };

    const PAGE_SIZE = 6;

    // DOM References
    const categoryListEl = document.getElementById("categoryList");
    const minPriceInput = document.getElementById("minPriceInput");
    const maxPriceInput = document.getElementById("maxPriceInput");
    const priceRangeDisplay = document.getElementById("priceRangeDisplay");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const productGrid = document.getElementById("productGrid");
    const productCount = document.getElementById("productCount");
    const activeFiltersEl = document.getElementById("activeFilters");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const clearCategoryBtn = document.getElementById("clearCategoryBtn");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const cartCountEl = document.getElementById("cartCount");
    const mobileFilterToggle = document.getElementById("mobileFilterToggle");
    const filtersPanel = document.getElementById("filtersPanel");

    // Modal References
    const productModal = document.getElementById("productModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalImg = document.getElementById("modalImg");
    const modalCategory = document.getElementById("modalCategory");
    const modalTitle = document.getElementById("modalTitle");
    const modalRating = document.getElementById("modalRating");
    const modalPrice = document.getElementById("modalPrice");
    const modalDescription = document.getElementById("modalDescription");
    const modalAddCartBtn = document.getElementById("modalAddCartBtn");

    // Helper: Render Star Rating String
    function formatStars(rating) {
      const fullStars = Math.round(rating);
      return "★".repeat(fullStars) + "☆".repeat(5 - fullStars);
    }

    // Build Unique Category Checkboxes Dynamically
    function renderCategoryFilters() {
      const uniqueCategories = [...new Set(products.map((p) => p.category))];
      categoryListEl.innerHTML = uniqueCategories
        .map(
          (cat) => `
          <label class="checkbox-label">
            <input type="checkbox" class="category-checkbox" value="${cat}" />
            <span>${cat}</span>
          </label>
        `
        )
        .join("");

      document.querySelectorAll(".category-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          state.categories = Array.from(document.querySelectorAll(".category-checkbox:checked")).map(
            (cb) => cb.value
          );
          state.visibleCount = PAGE_SIZE;
          updateCollection();
        });
      });
    }

    // Filter + Sort Pipeline using filter() and sort()
    function getProcessedProducts() {
      const filtered = products.filter((item) => {
        const matchesSearch = item.name.toLowerCase().includes(state.search.trim().toLowerCase());
        const matchesCategory = state.categories.length === 0 || state.categories.includes(item.category);
        const matchesMinPrice = state.minPrice === null || item.price >= state.minPrice;
        const matchesMaxPrice = state.maxPrice === null || item.price <= state.maxPrice;
        const matchesRating = item.rating >= state.minRating;

        return matchesSearch && matchesCategory && matchesMinPrice && matchesMaxPrice && matchesRating;
      });

      const sorted = [...filtered].sort((a, b) => {
        switch (state.sortBy) {
          case "price-asc":
            return a.price - b.price;
          case "price-desc":
            return b.price - a.price;
          case "rating-asc":
            return a.rating - b.rating;
          case "rating-desc":
            return b.rating - a.rating;
          case "name-asc":
            return a.name.localeCompare(b.name);
          case "name-desc":
            return b.name.localeCompare(a.name);
          default:
            return a.id - b.id;
        }
      });

      return sorted;
    }

    // Render Price Range Text
    function updatePriceDisplay() {
      if (state.minPrice !== null && state.maxPrice !== null) {
        priceRangeDisplay.textContent = `Selected Price: $${state.minPrice.toFixed(2)} – $${state.maxPrice.toFixed(2)}`;
      } else if (state.minPrice !== null) {
        priceRangeDisplay.textContent = `Selected Price: $${state.minPrice.toFixed(2)} and above`;
      } else if (state.maxPrice !== null) {
        priceRangeDisplay.textContent = `Selected Price: Up to $${state.maxPrice.toFixed(2)}`;
      } else {
        priceRangeDisplay.textContent = "Selected Price: Any";
      }
    }

    // Render Active Filter Badges
    function renderActiveBadges() {
      const badges = [];

      if (state.search.trim()) {
        badges.push({ label: `Search: "${state.search.trim()}"`, type: "search" });
      }
      state.categories.forEach((cat) => {
        badges.push({ label: `Category: ${cat}`, type: "category", value: cat });
      });
      if (state.minPrice !== null || state.maxPrice !== null) {
        const minTxt = state.minPrice !== null ? `$${state.minPrice}` : "$0";
        const maxTxt = state.maxPrice !== null ? `$${state.maxPrice}` : "Any";
        badges.push({ label: `Price: ${minTxt} - ${maxTxt}`, type: "price" });
      }
      if (state.minRating > 0) {
        badges.push({ label: `${state.minRating}+ Stars`, type: "rating" });
      }

      activeFiltersEl.innerHTML = badges
        .map(
          (b, idx) => `
          <span class="filter-badge">
            ${b.label}
            <button type="button" data-badge-index="${idx}" aria-label="Remove filter">×</button>
          </span>
        `
        )
        .join("");

      activeFiltersEl.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const badge = badges[Number(btn.dataset.badgeIndex)];
          if (badge.type === "search") {
            state.search = "";
            searchInput.value = "";
          } else if (badge.type === "category") {
            state.categories = state.categories.filter((c) => c !== badge.value);
            document.querySelectorAll(".category-checkbox").forEach((cb) => {
              if (cb.value === badge.value) cb.checked = false;
            });
          } else if (badge.type === "price") {
            state.minPrice = null;
            state.maxPrice = null;
            minPriceInput.value = "";
            maxPriceInput.value = "";
            updatePriceDisplay();
          } else if (badge.type === "rating") {
            state.minRating = 0;
            document.querySelector('input[name="rating"][value="0"]').checked = true;
          }
          state.visibleCount = PAGE_SIZE;
          updateCollection();
        });
      });
    }

    // Render Product Cards using map()
    function renderProducts(items) {
      productCount.textContent = `Showing ${Math.min(items.length, state.visibleCount)} of ${items.length} matching products (${products.length} total)`;

      if (items.length === 0) {
        productGrid.innerHTML = `
          <div class="empty-state">
            <h3>No products match your selected filters</h3>
            <p>Try adjusting your price range, rating, categories, or clear all filters to see everything.</p>
            <button class="add-cart-btn" id="emptyResetBtn">Reset All Filters</button>
          </div>
        `;
        loadMoreWrap.style.display = "none";
        document.getElementById("emptyResetBtn").addEventListener("click", clearAllFilters);
        return;
      }

      const visibleItems = items.slice(0, state.visibleCount);

      productGrid.innerHTML = visibleItems
        .map(
          (product) => `
          <article class="product-card" data-id="${product.id}">
            <img src="${product.image}" alt="${product.name}" class="product-img" data-action="details" />
            <div class="product-body">
              <div class="product-category">${product.category}</div>
              <h3 class="product-title" data-action="details">${product.name}</h3>
              <div class="product-rating">
                ${formatStars(product.rating)}
                <span>(${product.rating.toFixed(1)})</span>
              </div>
              <div class="product-footer">
                <span class="product-price">$${product.price.toFixed(2)}</span>
                <button class="add-cart-btn" data-action="add-cart">Add to Cart</button>
              </div>
            </div>
          </article>
        `
        )
        .join("");

      loadMoreWrap.style.display = items.length > state.visibleCount ? "block" : "none";
    }

    // Open Product Details Modal
    function openProductModal(productId) {
      const product = products.find((p) => p.id === productId);
      if (!product) return;

      modalImg.src = product.image;
      modalImg.alt = product.name;
      modalCategory.textContent = product.category;
      modalTitle.textContent = product.name;
      modalRating.innerHTML = `${formatStars(product.rating)} <span>(${product.rating.toFixed(1)} / 5.0)</span>`;
      modalPrice.textContent = `$${product.price.toFixed(2)}`;
      modalDescription.textContent = product.description;
      modalAddCartBtn.onclick = () => addToCart(product.name);

      productModal.classList.add("open");
    }

    function addToCart(productName) {
      state.cartCount += 1;
      cartCountEl.textContent = state.cartCount;
      alert(`"${productName}" added to cart!`);
    }

    function clearCategoryFilter() {
      state.categories = [];
      document.querySelectorAll(".category-checkbox").forEach((cb) => {
        cb.checked = false;
      });
      state.visibleCount = PAGE_SIZE;
      updateCollection();
    }

    function clearAllFilters() {
      state.search = "";
      state.categories = [];
      state.minPrice = null;
      state.maxPrice = null;
      state.minRating = 0;
      state.sortBy = "default";
      state.visibleCount = PAGE_SIZE;

      searchInput.value = "";
      minPriceInput.value = "";
      maxPriceInput.value = "";
      sortSelect.value = "default";
      document.querySelector('input[name="rating"][value="0"]').checked = true;
      document.querySelectorAll(".category-checkbox").forEach((cb) => {
        cb.checked = false;
      });

      updatePriceDisplay();
      updateCollection();
    }

    // Master Update Function
    function updateCollection() {
      updatePriceDisplay();
      renderActiveBadges();
      const processed = getProcessedProducts();
      renderProducts(processed);
    }

    // Event Listeners
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      state.visibleCount = PAGE_SIZE;
      updateCollection();
    });

    minPriceInput.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      state.minPrice = Number.isNaN(val) || val < 0 ? null : val;
      state.visibleCount = PAGE_SIZE;
      updateCollection();
    });

    maxPriceInput.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      state.maxPrice = Number.isNaN(val) || val < 0 ? null : val;
      state.visibleCount = PAGE_SIZE;
      updateCollection();
    });

    document.querySelectorAll('input[name="rating"]').forEach((radio) => {
      radio.addEventListener("change", (e) => {
        state.minRating = Number(e.target.value);
        state.visibleCount = PAGE_SIZE;
        updateCollection();
      });
    });

    sortSelect.addEventListener("change", (e) => {
      state.sortBy = e.target.value;
      updateCollection();
    });

    clearCategoryBtn.addEventListener("click", clearCategoryFilter);
    clearAllBtn.addEventListener("click", clearAllFilters);
    document.getElementById("resetLogo").addEventListener("click", (e) => {
      e.preventDefault();
      clearAllFilters();
    });

    loadMoreBtn.addEventListener("click", () => {
      state.visibleCount += PAGE_SIZE;
      updateCollection();
    });

    // Event Delegation for Product Cards
    productGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".product-card");
      if (!card) return;
      const productId = Number(card.dataset.id);
      const action = e.target.dataset.action;

      if (action === "add-cart") {
        const product = products.find((p) => p.id === productId);
        if (product) addToCart(product.name);
      } else if (action === "details") {
        openProductModal(productId);
      }
    });

    closeModalBtn.addEventListener("click", () => productModal.classList.remove("open"));
    productModal.addEventListener("click", (e) => {
      if (e.target === productModal) productModal.classList.remove("open");
    });

    mobileFilterToggle.addEventListener("click", () => {
      filtersPanel.classList.toggle("open");
    });

    // Initialize App
    renderCategoryFilters();
    updateCollection();
  </script>
</body>
</html>
